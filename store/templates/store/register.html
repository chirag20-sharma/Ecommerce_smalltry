{% extends 'store/base.html' %}
{% block content %}
<div class="auth-container">
    <h1>Create Account</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required class="form-input">
        <input type="email" name="email" placeholder="Email" required class="form-input">
        <input type="password" name="password" placeholder="Password" required class="form-input">
        <button type="submit" class="btn btn-primary full-width">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
